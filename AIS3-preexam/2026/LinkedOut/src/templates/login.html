{% extends "base.html" %}
{% block content %}
<section class="auth-wrap panel">
  <div class="panel-pad">
    <h1>Sign in</h1>
    <p class="muted">Stay updated on your professional world.</p>
    {% if error %}<p class="notice">{{ error }}</p>{% endif %}
    <form method="post">
      <p><input name="email" placeholder="Email"></p>
      <p><input name="password" type="password" placeholder="Password"></p>
      <p><button type="submit">Sign in</button></p>
    </form>
    <p class="muted">New to LinkedOut? <a href="/register">Join now</a></p>
  </div>
</section>
{% endblock %}
